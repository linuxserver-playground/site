# Every pull request: the build must pass (front matter and data shapes are validated here), TypeScript and
# Astro diagnostics must be clean, and accessibility is checked on the key pages with axe-core.
name: Check

on:
  pull_request:

env:
  SITE_URL: https://linuxserver-playground.github.io
  BASE_PATH: /site/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Accessibility (axe) and search
        run: |
          npx playwright install --with-deps chromium
          npx astro preview --port 4321 &
          npx wait-on http://localhost:4321/site/
          node scripts/a11y.mjs http://localhost:4321/site
          node scripts/test-search.mjs http://localhost:4321/site
