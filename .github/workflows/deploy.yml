# Builds the site and publishes it to GitHub Pages: on every push to main, daily, when the hub tells us it
# has new data (repository_dispatch type `hub-updated`, relayed by the control plane after each successful hub
# Deploy), and on demand.
#
# Every run restores the data snapshots from the `data` branch, refreshes them from the hub (HUB_URL), GitHub and
# Open Collective, and publishes them back as that branch's one commit (scripts/snapshot.sh), so the build is
# reproducible from the repository alone and main's history holds only what people write.
#
# One job: the Pages deploy is a step, not a job of its own, because every job waits separately for one of the
# organisation's 20 runner slots, and during a burst of image builds that second wait was up to 12 minutes for
# 20 seconds of work.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  repository_dispatch:
    types: [hub-updated]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # The job is deploy-run.yml, which the Labs site calls too. Calling it adds no runner job.
    uses: ./.github/workflows/deploy-run.yml
    secrets: inherit
