# Builds the site and publishes it to GitHub Pages: on every push to main, daily, when the hub tells us it
# has new data (repository_dispatch type `hub-updated`, sent by the hub's deploy workflow), and on demand.
#
# Every run first refreshes src/data/ from the hub (HUB_URL), GitHub and Open Collective and commits the
# snapshots, so the build is reproducible from the repository alone.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  repository_dispatch:
    types: [hub-updated]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://linuxserver-playground.github.io
  BASE_PATH: /site/
  HUB_URL: ${{ vars.HUB_URL || 'https://linuxserver-playground.github.io/hub' }}
  GITHUB_ORG: linuxserver-playground

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # posts and docs are dated from git history (src/lib/git-dates.ts)

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Refresh data snapshots from the hub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run data

      - name: Commit refreshed snapshots
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data src/assets/logos src/assets/team
          if ! git diff --cached --quiet; then
            git commit -m "Refresh data snapshots [skip ci]"
            git push
          fi

      - name: Cache optimised images
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-${{ hashFiles('src/content/**', 'src/assets/**', 'package-lock.json') }}
          restore-keys: astro-

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
